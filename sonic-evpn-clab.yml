name: sonic-evpn

mgmt:
  network: sonic-evpn-lab-mgmt
  ipv4-subnet: 172.40.40.0/24

prefix: ""
topology:
  defaults:
    kind: sonic-vm
  kinds:
    sonic-vm:
      image: vrnetlab/sonic_sonic-vs:2511
    linux:
      image: ghcr.io/mfzhsn/network-multitool-sshd:0.0.5

  nodes:
    leaf11:
      kind: sonic-vm
      mgmt-ipv4: 172.40.40.2
      
  
    leaf12:
      kind: sonic-vm
      mgmt-ipv4: 172.40.40.4
      
  
    spine11:
      kind: sonic-vm
      mgmt-ipv4: 172.40.40.3
  
    spine12:
      kind: sonic-vm
      mgmt-ipv4: 172.40.40.5
  
    client11:
      kind: linux
      mgmt-ipv4: 172.40.40.10
      exec:
        - ip address add 172.16.10.50/24 dev eth1

    client12:
      kind: linux
      mgmt-ipv4: 172.40.40.11
      exec:
        - ip address add 10.80.1.1/24 dev eth1
        - ip route add 10.90.1.0/24 via 10.80.1.254

    client13:
      kind: linux
      mgmt-ipv4: 172.40.40.12
      exec:
        - ip address add 172.16.10.60/24 dev eth1

    client14:
      kind: linux
      mgmt-ipv4: 172.40.40.13
      exec:
        - ip address add 10.90.1.1/24 dev eth1
        - ip route add 10.80.1.0/24 via 10.90.1.254

  links:
    # spine-leaf links
    - endpoints: ["leaf11:eth1", "spine11:eth1"]
    - endpoints: ["leaf12:eth1", "spine11:eth2"]
    - endpoints: ["leaf11:eth2", "spine12:eth1"]
    - endpoints: ["leaf12:eth2", "spine12:eth2"]
    # leaf-client links
    - endpoints: ["client11:eth1", "leaf11:eth10"]
    - endpoints: ["client12:eth1", "leaf11:eth11"]
    - endpoints: ["client13:eth1", "leaf12:eth10"]
    - endpoints: ["client14:eth1", "leaf12:eth11"]

