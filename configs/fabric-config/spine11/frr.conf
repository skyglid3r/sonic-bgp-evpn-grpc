frr version 10.4.1
frr defaults traditional
hostname spine1
log syslog informational
log facility local4
agentx
zebra nexthop-group keep 1
fpm address 127.0.0.1
no fpm use-next-hop-groups
service integrated-vtysh-config
!
ip prefix-list PL_LoopbackV4 seq 5 permit 11.11.11.11/32
!
route-map RM_SET_SRC permit 10
 set src 11.11.11.11
exit
!
password zebra
enable password zebra
!
router bgp 65000
 bgp router-id 11.11.11.11
 no bgp ebgp-requires-policy
 neighbor 1.1.1.1 remote-as 65001
 neighbor 1.1.1.1 ebgp-multihop 5
 neighbor 2.2.2.2 remote-as 65002
 neighbor 2.2.2.2 ebgp-multihop 5
 neighbor 192.168.10.2 remote-as 65001
 neighbor 192.168.20.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 11.11.11.11/32
  no neighbor 1.1.1.1 activate
  no neighbor 2.2.2.2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 1.1.1.1 activate
  neighbor 2.2.2.2 activate
 exit-address-family
exit
!
access-list all seq 5 permit any
!
ip protocol bgp route-map RM_SET_SRC
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
